<body>

    <main class="enigma">

        <div class="simbolo">?</div>

        <h1>Você encontrou o enigma.</h1>

        <p>
            A resposta não está escrita diretamente.
        </p>

        <div class="pista">

            <h2>Decifre isto:</h2>

            <p class="codigo">
                8 - 1 - 16 - 16 - 25

            <p>
                Cada número representa uma posição.
                <br>
                O alfabeto sabe o caminho.
            </p>

        </div>

        <div class="url">

            <p>Há outra pista escondida aqui:</p>

            <span>
                68 65 72 74 61 2E 68 74 6D 6C
            </span>

        </div>

        <a href="index.html">
