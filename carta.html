<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Carta</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="carta">

        <h1>Para você</h1>

        <div class="texto">

            <p>
                Finalmente você conseguiu abrir.
            </p>

            <p>
                Talvez a parte mais interessante dessa carta
                tenha sido descobrir o caminho até ela.
            </p>

            <p>
                Algumas coisas não precisam ser encontradas
                imediatamente. Às vezes, o caminho faz parte
                da mensagem.
            </p>

        </div>

        <div class="galeria">

            <img src="FOTOS/foto1.jpg" alt="Foto 1">
            <img src="FOTOS/foto2.jpg" alt="Foto 2">
            <img src="FOTOS/foto3.jpg" alt="Foto 3">

        </div>

    </main>

</body>
</html>
